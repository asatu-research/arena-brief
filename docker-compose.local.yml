# Opsi dev/local: Postgres di VPS sendiri (tanpa Supabase).
# Pakai: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# .env: DATABASE_URL=postgresql+asyncpg://arena:arena_secret@localhost:5432/arena
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_secret}
      POSTGRES_DB: arena
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
