<meta charset="utf-8">
<title>Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EEEDF3; --surface:#F8F7FB; --raise:#FFFFFF;
  --ink:#191B2A; --ink2:#454761; --ink3:#7B7C93;
  --line:#D5D3E0; --line-soft:#E4E2ED;
  --accent:#5A4FA3; --accent-on:#FFFFFF; --accent-wash:rgba(90,79,163,.10);
  --crit:#B3372C; --warn:#A8760F; --good:#1E7A5A;
  --crit-wash:rgba(179,55,44,.10); --warn-wash:rgba(168,118,15,.12); --good-wash:rgba(30,122,90,.10);
  --f-disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:236px; --dossier:392px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121220; --surface:#191927; --raise:#1F1F30;
    --ink:#EAE9F4; --ink2:#B3B1C8; --ink3:#7E7C95;
    --line:#2E2E44; --line-soft:#252537;
    --accent:#9F92F0; --accent-on:#15152A; --accent-wash:rgba(159,146,240,.14);
    --crit:#E8756A; --warn:#DFAE4C; --good:#4FBF95;
    --crit-wash:rgba(232,117,106,.13); --warn-wash:rgba(223,174,76,.13); --good-wash:rgba(79,191,149,.13);
  }
}
:root[data-theme="dark"]{
  --paper:#121220; --surface:#191927; --raise:#1F1F30;
  --ink:#EAE9F4; --ink2:#B3B1C8; --ink3:#7E7C95;
  --line:#2E2E44; --line-soft:#252537;
  --accent:#9F92F0; --accent-on:#15152A; --accent-wash:rgba(159,146,240,.14);
  --crit:#E8756A; --warn:#DFAE4C; --good:#4FBF95;
  --crit-wash:rgba(232,117,106,.13); --warn-wash:rgba(223,174,76,.13); --good-wash:rgba(79,191,149,.13);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* header band */
.band{
  display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.mark{display:flex;align-items:baseline;gap:10px;width:calc(var(--rail) - 20px);flex:none}
.mark b{font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.16em;text-transform:uppercase}
.mark span{font-family:var(--f-mono);font-size:9.5px;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase}
.band-mid{flex:1;min-width:0;overflow:hidden}
.tape{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.tape-item{display:flex;align-items:baseline;gap:7px;white-space:nowrap;padding:0 14px;border-left:1px solid var(--line-soft)}
.tape-item:first-child{border-left:0;padding-left:0}
.tape-k{font-family:var(--f-mono);font-size:9.5px;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase}
.tape-v{font-family:var(--f-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.tape-d{font-family:var(--f-mono);font-size:11px}
.up{color:var(--good)} .down{color:var(--crit)} .flat{color:var(--ink3)}
.band-right{display:flex;align-items:center;gap:14px;flex:none}
.stamp{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:3px 7px;
  transform:rotate(-1.2deg);opacity:.85;white-space:nowrap;
}
.sync{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);white-space:nowrap}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--good);animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--good-wash)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.theme-btn{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;color:var(--ink2);font-family:var(--f-mono);font-size:12px}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100vh - 56px)}
.rail{
  border-right:1px solid var(--line);background:var(--surface);padding:14px 0 40px;
  position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow-y:auto;
}
.arena-btn{width:100%;text-align:left;padding:11px 18px;display:flex;align-items:center;gap:11px;border-left:3px solid transparent;color:var(--ink2)}
.arena-btn .glyph{width:22px;height:22px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.arena-btn .lbl{font-family:var(--f-disp);font-weight:600;font-size:14.5px;flex:1}
.arena-btn .cnt{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}
.arena-btn:hover{background:var(--accent-wash);color:var(--ink)}
.arena-btn[aria-selected="true"]{border-left-color:var(--accent);background:var(--accent-wash);color:var(--ink)}
.arena-btn[aria-selected="true"] .glyph{border-color:var(--accent);color:var(--accent)}

.rail-sec{padding:20px 18px 0}
.rail-h{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:9px;margin-bottom:8px;border-bottom:1px solid var(--line-soft);
}
.rail-h button{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;color:var(--accent);text-transform:none}
.chk{display:flex;align-items:center;gap:9px;padding:4.5px 0;cursor:pointer;color:var(--ink2)}
.chk:hover{color:var(--ink)}
.chk input{appearance:none;width:13px;height:13px;flex:none;border:1px solid var(--line);border-radius:2px;background:var(--raise);position:relative;cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";position:absolute;left:3.6px;top:1px;width:3.2px;height:7px;border:solid var(--accent-on);border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.chk .t{flex:1;font-size:12.5px;line-height:1.35}
.chk .n{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}

/* workspace */
.work{display:flex;flex-direction:column;min-width:0}
.subnav{display:flex;align-items:center;gap:2px;padding:0 20px;height:46px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:56px;z-index:30}
.subtab{padding:7px 13px;font-size:13px;color:var(--ink3);border-radius:3px;display:flex;align-items:center;gap:7px}
.subtab:hover{color:var(--ink);background:var(--accent-wash)}
.subtab[aria-selected="true"]{color:var(--ink);font-weight:600;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--line)}
.subtab .b{font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.subnav .spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:3px;padding:5px 10px;background:var(--raise);min-width:220px}
.search input{border:0;background:none;font:inherit;font-size:12.5px;color:var(--ink);width:100%;outline:0}
.search input::placeholder{color:var(--ink3)}
.search .ic{font-family:var(--f-mono);font-size:11px;color:var(--ink3)}

.split{display:grid;grid-template-columns:minmax(0,1fr) var(--dossier);flex:1;min-height:0}
.stream{min-width:0;border-right:1px solid var(--line)}
.dossier{position:sticky;top:102px;align-self:start;height:calc(100vh - 102px);overflow-y:auto;background:var(--surface)}

/* ledger */
.lg-head{
  display:grid;grid-template-columns:76px 104px minmax(0,1fr) 96px 72px;gap:14px;
  padding:9px 20px;border-bottom:1px solid var(--line);
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);
  background:var(--surface);position:sticky;top:102px;z-index:20;
}
.row{
  display:grid;grid-template-columns:76px 104px minmax(0,1fr) 96px 72px;gap:14px;
  padding:13px 20px 13px 17px;width:100%;text-align:left;
  border-bottom:1px solid var(--line-soft);border-left:3px solid transparent;align-items:start;
}
.row:hover{background:var(--accent-wash)}
.row.sev-high{border-left-color:var(--crit)}
.row.sev-med{border-left-color:var(--warn)}
.row.sev-low{border-left-color:var(--line)}
.row[aria-current="true"]{background:var(--accent-wash);box-shadow:inset 2px 0 0 var(--accent)}
.r-date{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);padding-top:2px}
.r-date b{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.r-src{font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;color:var(--ink2);padding-top:3px;line-height:1.35}
.r-title{font-family:var(--f-disp);font-weight:600;font-size:14.5px;line-height:1.35;letter-spacing:-.005em;text-wrap:balance}
.r-brief{color:var(--ink3);font-size:12.5px;line-height:1.45;margin-top:3px;max-width:66ch}
.r-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line);border-radius:2px;padding:1.5px 5px}
.r-type{font-family:var(--f-mono);font-size:10.5px;color:var(--ink2);padding-top:3px;line-height:1.4}
.r-sev{padding-top:2px}
.sev{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:2px;display:inline-block}
.sev.high{color:var(--crit);background:var(--crit-wash)}
.sev.med{color:var(--warn);background:var(--warn-wash)}
.sev.low{color:var(--ink3);background:var(--line-soft)}
.empty{padding:64px 20px;text-align:center;color:var(--ink3);font-size:13px}

/* dossier */
.dos-top{padding:18px 22px 15px;border-bottom:1px solid var(--line)}
.dos-eyebrow{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}
.dos-title{font-family:var(--f-disp);font-weight:700;font-size:19px;line-height:1.25;letter-spacing:-.015em;text-wrap:balance}
.dos-meta{margin:13px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:12.5px}
.dos-meta dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding-top:2px}
.dos-meta dd{margin:0;color:var(--ink2)}
.dos-sec{padding:16px 22px;border-bottom:1px solid var(--line-soft)}
.dos-h{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.dos-sec p{margin:0 0 9px;font-size:13px;line-height:1.62;color:var(--ink2)}
.dos-sec p:last-child{margin-bottom:0}
.deltas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.deltas li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.deltas .mk{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);padding-top:2px}
.watch{border-left:2px solid var(--accent);padding:2px 0 2px 12px;font-size:13px;line-height:1.55;color:var(--ink)}
.dos-acts{padding:16px 22px 40px;display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:3px;padding:9px 12px;font-size:12.5px;color:var(--ink2);background:var(--raise);width:100%;text-align:left}
.act:hover{border-color:var(--accent);color:var(--accent)}
.act .k{font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.dos-blank{padding:72px 26px;color:var(--ink3);font-size:13px;line-height:1.65;text-align:center}
.dos-blank b{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:10px}

/* RUU tracker */
.ruu{padding:4px 20px 40px}
.ruu-item{padding:18px 0;border-bottom:1px solid var(--line-soft);display:grid;grid-template-columns:minmax(0,1fr) 176px;gap:24px;align-items:start}
.ruu-name{font-family:var(--f-disp);font-weight:600;font-size:15.5px;letter-spacing:-.005em}
.ruu-sub{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);margin-top:4px;letter-spacing:.03em}
.stages{display:flex;gap:3px;margin-top:14px}
.stage{flex:1;min-width:0}
.stage .bar{height:5px;border-radius:1px;background:var(--line-soft)}
.stage.done .bar{background:var(--accent)}
.stage.now .bar{background:var(--accent);animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
.stage .sl{font-family:var(--f-mono);font-size:9px;color:var(--ink3);margin-top:6px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage.now .sl{color:var(--accent);font-weight:500}
.ruu-side{display:flex;flex-direction:column;gap:7px;align-items:flex-end;text-align:right}
.ruu-buzz{font-family:var(--f-mono);font-size:10px;color:var(--ink3);letter-spacing:.04em}
.ruu-note{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-top:12px;max-width:74ch}

/* economic */
.eco{display:grid;grid-template-columns:minmax(0,1fr) 336px;flex:1;min-height:0}
.eco-main{min-width:0;border-right:1px solid var(--line);padding-bottom:40px}
.eco-side{position:sticky;top:102px;align-self:start;height:calc(100vh - 102px);overflow-y:auto;background:var(--surface)}
.eco-hero{padding:22px 24px 6px}
.eco-kicker{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.eco-title{font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:7px 0 0;line-height:1.15}
.eco-figs{display:flex;align-items:flex-end;gap:28px;margin-top:16px;flex-wrap:wrap}
.figbig{font-family:var(--f-mono);font-size:44px;font-weight:500;line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.figbig sup{font-size:15px;font-weight:400;color:var(--ink3);margin-left:4px;letter-spacing:0}
.figside{display:flex;flex-direction:column;gap:3px}
.figside .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.figside .v{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.chart-ctl{display:flex;align-items:center;gap:16px;padding:14px 24px 10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{padding:5px 11px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--accent-wash);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-on)}
.readout{font-family:var(--f-mono);font-size:11px;color:var(--ink2);margin-left:auto;border:1px solid var(--line);border-radius:3px;padding:4px 9px;background:var(--raise);white-space:nowrap}
.chartwrap{padding:0 12px}
.chartwrap svg{display:block;width:100%;height:auto}
.eco-note{padding:16px 24px 0;font-size:12.5px;line-height:1.65;color:var(--ink3);max-width:80ch;border-top:1px solid var(--line-soft);margin-top:14px}
.eco-note b{color:var(--ink2);font-weight:600}
.eco-note .src{display:block;margin-top:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase}

.verdict{padding:20px 24px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:start}
.vd-badge{display:flex;flex-direction:column;align-items:flex-start;gap:7px;flex:none}
.vd-eyebrow{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.vd-word{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:-.01em;padding:3px 12px;border-radius:3px;white-space:nowrap}
.vd-word.good{color:var(--good);background:var(--good-wash)}
.vd-word.warn{color:var(--warn);background:var(--warn-wash)}
.vd-word.crit{color:var(--crit);background:var(--crit-wash)}
.vd-rank{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}
.vd-body{min-width:0}
.vd-body p{margin:0 0 14px;font-size:13px;line-height:1.62;color:var(--ink2);max-width:78ch}
.vd-grid{display:flex;flex-direction:column;gap:11px}
.vd-row{display:grid;grid-template-columns:132px minmax(0,1fr) 46px;gap:12px;align-items:center}
.vd-name{font-size:12px;color:var(--ink2);line-height:1.3}
.vd-track{position:relative;height:16px}
.vd-line{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.vd-dot{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:var(--ink3);opacity:.55;transform:translate(-50%,-50%)}
.vd-dot.id{width:10px;height:10px;background:var(--accent);opacity:1;box-shadow:0 0 0 3px var(--accent-wash)}
.vd-dot-label{position:absolute;top:-15px;transform:translateX(-50%);font-family:var(--f-mono);font-size:9px;color:var(--ink3);white-space:nowrap}
.vd-dot.id .vd-dot-label{color:var(--accent);font-weight:500}
.vd-rankbadge{font-family:var(--f-mono);font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums}
.vd-foot{font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;color:var(--ink3);margin-top:14px}

.ind-h{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);padding:14px 18px 9px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;justify-content:space-between}
.ind{display:grid;grid-template-columns:minmax(0,1fr) 66px 70px;gap:8px;align-items:center;width:100%;text-align:left;padding:10px 18px;border-bottom:1px solid var(--line-soft);border-left:3px solid transparent}
.ind:hover{background:var(--accent-wash)}
.ind[aria-current="true"]{border-left-color:var(--accent);background:var(--accent-wash)}
.ind-n{font-size:12.5px;line-height:1.3;color:var(--ink)}
.ind-u{font-family:var(--f-mono);font-size:9.5px;color:var(--ink3);letter-spacing:.03em;margin-top:2px}
.ind-v{font-family:var(--f-mono);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.ind-d{font-family:var(--f-mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.spark{display:block;width:100%;height:24px;grid-column:1/-1;margin-top:5px}
.rilis-row{display:grid;grid-template-columns:66px minmax(0,1fr);gap:12px;padding:10px 18px;border-bottom:1px solid var(--line-soft);align-items:start}
.rilis-d{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);padding-top:2px}
.rilis-t{font-size:12.5px;line-height:1.4}
.rilis-s{font-family:var(--f-mono);font-size:9.5px;color:var(--ink3);letter-spacing:.05em;margin-top:3px;text-transform:uppercase}
.rilis-row.next{background:var(--accent-wash)}
.rilis-row.next .rilis-d{color:var(--accent);font-weight:500}

@media (prefers-reduced-motion:reduce){.pulse,.stage.now .bar{animation:none}}
@media (max-width:1240px){

function regionalRank(g){
  const order = ASEAN.slice().sort((a,b) => g.baik === "naik" ? g.v[b]-g.v[a] : g.v[a]-g.v[b]);
  return order.indexOf("ID") + 1;
}
function regionalVerdict(){
  const ranks = REGIONAL.map(regionalRank);
  const avg = ranks.reduce((a,b) => a+b, 0) / ranks.length;
  const tier = avg <= 2 ? "sangat" : avg <= 4 ? "baik" : "kurang";
  const label = { sangat:"Sangat Baik", baik:"Baik", kurang:"Kurang Baik" }[tier];
  const tone = { sangat:"good", baik:"good", kurang:"crit" }[tier];
  return { avg, ranks, tier, label, tone };
}

/* ── deret waktu sintetis dari anchor tahunan ────────────── */
function seed(n){ let x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
function buildSeries(ind){
  const yrs = Object.keys(ind.a).map(Number).sort((a,b)=>a-b);
  const out = [];
  let k = 0;
  for(let y = yrs[0]; y <= yrs[yrs.length-1]; y++){
    const lastMonth = (y === 2026) ? 7 : 11;
    for(let m = 0; m <= lastMonth; m++){
      const cur = ind.a[y];
      const nxt = ind.a[y+1] !== undefined ? ind.a[y+1] : cur;
      const t = m / 12;
      const base = cur + (nxt - cur) * t;
      const wob = (seed(k*3.7 + y) - .5) * 2 * ind.vol + Math.sin(k/5.5) * ind.vol * .45;
      out.push({ y, m, v: base + wob });
      k++;
    }
  }
  return out;
}
IND.forEach(i => { i.series = buildSeries(i); });

function tglShort(iso){ const d = new Date(iso + "T00:00:00"); return { d: String(d.getDate()).padStart(2,"0"), m: BULAN[d.getMonth()], y: d.getFullYear() }; }

function renderTape(){
  const picks = ["inflasi","pdb","tpt","dagang","ntp"];
  $("#tape").innerHTML = picks.map(id => {
    const i = IND.find(x => x.id === id);
    const s = i.series, last = s[s.length-1].v, prev = s[s.length-13].v;
    const d = last - prev;
    const good = i.baik === "naik" ? d > 0 : d < 0;
    const cls = Math.abs(d) < .01 ? "flat" : good ? "up" : "down";
    const arrow = Math.abs(d) < .01 ? "=" : d > 0 ? "▲" : "▼";
    return '<div class="tape-item"><span class="tape-k">' + esc(i.nama.split(" (")[0]) + '</span>' +
      '<span class="tape-v">' + fmt(last, i.dec) + '</span>' +
      '<span class="tape-d ' + cls + '">' + arrow + " " + fmt(Math.abs(d), i.dec) + '</span></div>';
  }).join("");
}

/* ── tracker RUU ─────────────────────────────────────────── */
function buzzSVG(vals){
  const w = 100, h = 22, mx = Math.max(...vals), mn = Math.min(...vals);
  const pts = vals.map((v,i) => [i/(vals.length-1)*w, h - 2 - (v-mn)/((mx-mn)||1)*(h-5)]);
  const d = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = d + " L" + w + " " + h + " L0 " + h + " Z";
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="120" height="26" aria-hidden="true">' +
    '<path d="' + area + '" fill="var(--accent-wash)"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"/>' +
    '<circle cx="' + pts[pts.length-1][0].toFixed(1) + '" cy="' + pts[pts.length-1][1].toFixed(1) + '" r="2" fill="var(--accent)"/></svg>';
}
function renderRUU(){
  view.innerHTML = '<div class="ruu">' +
    '<div style="padding:18px 0 16px;border-bottom:1px solid var(--line)">' +
    '<div class="eco-kicker">Ditarik dari laman DPR dan pemberitaan bernama RUU</div>' +
    '<p style="margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--ink2);max-width:74ch">' +
    'Tahap resmi diambil dari laman DPR. Kolom kanan menghitung penyebutan nama RUU di pemberitaan dua belas bulan terakhir, sebagai perkiraan kasar tekanan publik, bukan ukuran kemajuan pembahasan.</p></div>' +
    RUUS.map(r => {
      const pct = Math.round(r.tahap / TAHAP.length * 100);
      return '<div class="ruu-item"><div>' +
        '<div class="ruu-name">' + esc(r.nama) + '</div>' +
        '<div class="ruu-sub">' + esc(r.pengusul) + ' · masuk Prolegnas ' + r.sejak + ' · ' + pct + '% tahapan</div>' +
        '<div class="stages">' + TAHAP.map((t,i) => {
          const cls = i < r.tahap - 1 ? "done" : i === r.tahap - 1 ? "now" : "";
          return '<div class="stage ' + cls + '"><div class="bar"></div><span class="sl">' + esc(t) + '</span></div>';
        }).join("") + '</div>' +
        '<p class="ruu-note">' + esc(r.catatan) + '</p></div>' +
        '<div class="ruu-side">' + buzzSVG(r.buzz) +
        '<span class="ruu-buzz">' + r.mentions + ' sebutan / bln</span>' +
        '<span class="ruu-buzz" style="color:var(--ink2)">' + esc(r.target) + '</span></div></div>';
    }).join("") + '</div>';
}

/* ── ekonomi ─────────────────────────────────────────────── */
function sparkSVG(ind){
  const s = ind.series.slice(-60);
  const vs = s.map(p => p.v), mx = Math.max(...vs), mn = Math.min(...vs);
  const w = 200, h = 24;
  const pts = vs.map((v,i) => [i/(vs.length-1)*w, h - 2 - (v-mn)/((mx-mn)||1)*(h-5)]);
  const d = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + d + ' L' + w + ' ' + h + ' L0 ' + h + ' Z" fill="var(--accent-wash)"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>';
}

function chartSVG(ind){
  const spans = { all:1e4, "10t":120, "5t":60, "3t":36 };
  const s = ind.series.slice(-Math.min(spans[S.rentang], ind.series.length));
  const W = 1000, H = 300, PL = 8, PR = 54, PT = 18, PB = 26;
  const vs = s.map(p => p.v);
  let mx = Math.max(...vs), mn = Math.min(...vs);
  const pad = (mx - mn) * .14 || 1; mx += pad; mn -= pad;
  if(mn < 0 && mn > -pad) mn = Math.min(mn, -pad);
  const X = i => PL + i/(s.length-1)*(W-PL-PR);
  const Y = v => PT + (mx-v)/(mx-mn)*(H-PT-PB);

  const ticks = 4, gy = [];
  for(let i = 0; i <= ticks; i++){
    const v = mn + (mx-mn)*i/ticks;
    gy.push('<line x1="' + PL + '" x2="' + (W-PR) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--line-soft)" stroke-width="1"/>' +
      '<text x="' + (W-PR+8) + '" y="' + (Y(v)+3.5).toFixed(1) + '" fill="var(--ink3)" font-family="IBM Plex Mono, monospace" font-size="11">' + fmt(v, ind.dec) + '</text>');
  }
  const zero = (mn < 0 && mx > 0)
    ? '<line x1="' + PL + '" x2="' + (W-PR) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="3 3"/>' : "";

  const yrsSpan = s[s.length-1].y - s[0].y;
  const step = yrsSpan > 20 ? 4 : yrsSpan > 10 ? 2 : 1;
  let gx = "";
  s.forEach((p,i) => {
    if(p.m === 0 && (p.y % step === 0)){
      gx += '<line x1="' + X(i).toFixed(1) + '" x2="' + X(i).toFixed(1) + '" y1="' + PT + '" y2="' + (H-PB) + '" stroke="var(--line-soft)" stroke-width="1"/>' +
        '<text x="' + X(i).toFixed(1) + '" y="' + (H-8) + '" fill="var(--ink3)" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle">' + (yrsSpan > 12 ? "’" + String(p.y).slice(2) : p.y) + '</text>';
    }
  });

  const eras = [[2008,4,2009,5,"Krisis global"],[2020,2,2021,2,"Pandemi"]];
  let band = "";
  eras.forEach(([y1,m1,y2,m2,lbl]) => {
    const i1 = s.findIndex(p => p.y === y1 && p.m === m1);
    const i2 = s.findIndex(p => p.y === y2 && p.m === m2);
    if(i1 < 0 || i2 < 0) return;
    band += '<rect x="' + X(i1).toFixed(1) + '" y="' + PT + '" width="' + (X(i2)-X(i1)).toFixed(1) + '" height="' + (H-PT-PB) + '" fill="var(--ink3)" opacity=".085"/>' +
      '<text x="' + (X(i1)+5).toFixed(1) + '" y="' + (PT+13) + '" fill="var(--ink3)" font-family="IBM Plex Mono, monospace" font-size="10" letter-spacing=".5">' + lbl + '</text>';
  });

  const d = s.map((p,i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const baseY = (mn < 0 && mx > 0) ? Y(0) : (H-PB);
  const area = d + " L" + X(s.length-1).toFixed(1) + " " + baseY.toFixed(1) + " L" + X(0).toFixed(1) + " " + baseY.toFixed(1) + " Z";
  const last = s[s.length-1];

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" id="chart" role="img" aria-label="Grafik ' + esc(ind.nama) + '">' +
    band + gy.join("") + gx + zero +
    '<path d="' + area + '" fill="var(--accent-wash)"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + X(s.length-1).toFixed(1) + '" cy="' + Y(last.v).toFixed(1) + '" r="3.6" fill="var(--accent)"/>' +
    '<circle cx="' + X(s.length-1).toFixed(1) + '" cy="' + Y(last.v).toFixed(1) + '" r="7" fill="none" stroke="var(--accent)" stroke-width="1" opacity=".4"/>' +
    '<line id="cross" x1="0" x2="0" y1="' + PT + '" y2="' + (H-PB) + '" stroke="var(--ink3)" stroke-width="1" opacity="0"/>' +
    '<rect id="hit" x="' + PL + '" y="' + PT + '" width="' + (W-PL-PR) + '" height="' + (H-PT-PB) + '" fill="transparent"/></svg>';
}

function vdTrack(g, rank){
  const vals = ASEAN.map(k => g.v[k]);
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const pos = v => ((v - mn) / ((mx - mn) || 1)) * 100;
  const dots = ASEAN.slice().sort((a,b) => pos(g.v[a]) - pos(g.v[b])).map(k => {
    const isID = k === "ID";
    return '<div class="vd-dot' + (isID ? " id" : "") + '" style="left:' + pos(g.v[k]).toFixed(1) + '%" title="' + esc(NEG_NAMA[k]) + " " + fmt(g.v[k], g.dec) + '">' +
      (isID ? '<span class="vd-dot-label">' + fmt(g.v[k], g.dec) + '</span>' : "") + '</div>';
  }).join("");
  return '<div class="vd-row"><span class="vd-name">' + esc(g.nama) + '</span>' +
    '<div class="vd-track"><div class="vd-line"></div>' + dots + '</div>' +
    '<span class="vd-rankbadge">' + rank + '/6</span></div>';
}

function renderVerdictPanel(){
  const vd = regionalVerdict();
  const rows = REGIONAL.map((g,i) => vdTrack(g, vd.ranks[i])).join("");
  const kuat = REGIONAL.filter((g,i) => vd.ranks[i] <= 2).map(g => g.nama.toLowerCase());
  const lemah = REGIONAL.filter((g,i) => vd.ranks[i] >= 5).map(g => g.nama.toLowerCase());
  const narasi = "Dibandingkan lima ekonomi ASEAN terbesar lainnya, posisi Indonesia rata-rata peringkat " +
    fmt(vd.avg, 1) + " dari 6 negara pada empat indikator inti." +
    (kuat.length ? " Unggul pada " + kuat.join(" dan ") + "." : "") +
    (lemah.length ? " Tertinggal pada " + lemah.join(" dan ") + ", dengan Vietnam dan Filipina tumbuh lebih cepat serta Thailand dan Singapura menekan pengangguran jauh lebih rendah." : "");
  return '<div class="verdict">' +
    '<div class="vd-badge"><span class="vd-eyebrow">Posisi kawasan</span>' +
    '<span class="vd-word ' + vd.tone + '">' + esc(vd.label) + '</span>' +
    '<span class="vd-rank">peringkat rata-rata ' + fmt(vd.avg, 1) + '/6</span></div>' +
    '<div class="vd-body"><p>' + narasi + '</p>' +
    '<div class="vd-grid">' + rows + '</div>' +
    '<div class="vd-foot">Dibandingkan: ' + ASEAN.map(k => esc(NEG_NAMA[k])).join(" · ") + ' · titik ungu = Indonesia · data contoh, bukan rilis resmi</div>' +
    '</div></div>';
}

function renderEco(){
  const ind = IND.find(i => i.id === S.ind);
  const s = ind.series, last = s[s.length-1], prev = s[s.length-13].v;
  const d = last.v - prev;
  const good = ind.baik === "naik" ? d > 0 : d < 0;
  const all = s.map(p => p.v);
  const hi = Math.max(...all), lo = Math.min(...all);
  const hiP = s[all.indexOf(hi)], loP = s[all.indexOf(lo)];

  view.innerHTML = '<div class="eco"><div class="eco-main">' +
    renderVerdictPanel() +
    '<div class="eco-hero">' +
    '<div class="eco-kicker">' + esc(ind.freq) + ' · ' + esc(ind.unit) + ' · nasional</div>' +
    '<h1 class="eco-title">' + esc(ind.nama) + '</h1>' +
    '<div class="eco-figs">' +
    '<div class="figbig">' + fmt(last.v, ind.dec) + '<sup>' + BULAN[last.m] + " " + last.y + '</sup></div>' +
    '<div class="figside"><span class="l">Setahun lalu</span><span class="v">' + fmt(prev, ind.dec) + '</span></div>' +
    '<div class="figside"><span class="l">Selisih</span><span class="v ' + (Math.abs(d) < .005 ? "flat" : good ? "up" : "down") + '">' + sgn(d) + '</span></div>' +
    '<div class="figside"><span class="l">Tertinggi</span><span class="v">' + fmt(hi, ind.dec) + ' <span style="color:var(--ink3);font-size:11px">' + BULAN[hiP.m] + " ’" + String(hiP.y).slice(2) + '</span></span></div>' +
    '<div class="figside"><span class="l">Terendah</span><span class="v">' + fmt(lo, ind.dec) + ' <span style="color:var(--ink3);font-size:11px">' + BULAN[loP.m] + " ’" + String(loP.y).slice(2) + '</span></span></div>' +
    '</div></div>' +
    '<div class="chart-ctl"><div class="seg">' +
    [["all","2000–kini"],["10t","10 thn"],["5t","5 thn"],["3t","3 thn"]].map(([k,l]) =>
      '<button data-rentang="' + k + '" aria-pressed="' + (S.rentang === k) + '">' + l + '</button>').join("") +
    '</div><div class="readout" id="readout">Arahkan kursor ke grafik</div></div>' +
    '<div class="chartwrap">' + chartSVG(ind) + '</div>' +
    '<div class="eco-note"><b>Baca cepat.</b> ' + esc(ind.ket) +
    '<span class="src">Sumber: Badan Pusat Statistik · seri disusun ulang dari rilis bulanan dan triwulanan · angka pada mockup ini adalah data contoh</span></div>' +
    '</div><aside class="eco-side">' +
    '<div class="ind-h"><span>Indikator</span><span>60 bln terakhir</span></div>' +
    IND.map(i => {
      const si = i.series, lv = si[si.length-1].v, pv = si[si.length-13].v, dd = lv - pv;
      const g = i.baik === "naik" ? dd > 0 : dd < 0;
      return '<button class="ind" data-ind="' + i.id + '" aria-current="' + (S.ind === i.id) + '">' +
        '<span><span class="ind-n">' + esc(i.nama) + '</span><span class="ind-u">' + esc(i.unit) + '</span></span>' +
        '<span class="ind-v">' + fmt(lv, i.dec) + '</span>' +
        '<span class="ind-d ' + (Math.abs(dd) < .005 ? "flat" : g ? "up" : "down") + '">' + sgn(dd) + '</span>' +
        sparkSVG(i) + '</button>';
    }).join("") +
    '<div class="ind-h" style="border-top:1px solid var(--line)"><span>Kalender rilis</span><span>BPS</span></div>' +
    RILIS.map(r => '<div class="rilis-row' + (r.next ? " next" : "") + '">' +
      '<span class="rilis-d">' + r.d + '</span>' +
      '<span><span class="rilis-t">' + esc(r.t) + '</span><span class="rilis-s">' + esc(r.s) + '</span></span></div>').join("") +
    '</aside></div>';

  wireChart(ind);
}

function wireChart(ind){
  const svg = document.getElementById("chart");
  if(!svg) return;
  const spans = { all:1e4, "10t":120, "5t":60, "3t":36 };
  const s = ind.series.slice(-Math.min(spans[S.rentang], ind.series.length));
  const W = 1000, PL = 8, PR = 54;
  const cross = document.getElementById("cross");
  const out = document.getElementById("readout");
  const move = e => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W;
    let i = Math.round((x - PL) / (W - PL - PR) * (s.length - 1));
    i = Math.max(0, Math.min(s.length - 1, i));
    const px = PL + i/(s.length-1)*(W-PL-PR);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("opacity", ".45");
    out.textContent = BULAN[s[i].m] + " " + s[i].y + "  ·  " + fmt(s[i].v, ind.dec) + " " + ind.unit.replace(" y-on-y","");
  };
  svg.addEventListener("mousemove", move);
  svg.addEventListener("mouseleave", () => { cross.setAttribute("opacity","0"); out.textContent = "Arahkan kursor ke grafik"; });
}

/* ── render ──────────────────────────────────────────────── */
function renderBody(){
  if(S.arena === "eco") renderEco();
  else if(S.sub === "ruu") renderRUU();
  else if(S.sub === "puncak") renderPuncak();
  else renderAliran();
}
function render(){
  document.querySelectorAll(".arena-btn").forEach(b => b.setAttribute("aria-selected", b.dataset.arena === S.arena));
  renderRail(); renderSubnav(); renderBody(); syncCounts();
}

/* ── events ──────────────────────────────────────────────── */
document.addEventListener("click", e => {
  const arena = e.target.closest("[data-arena]");
  if(arena){ S.arena = arena.dataset.arena; render(); return; }
  const sub = e.target.closest("[data-sub]");
  if(sub){ S.sub = sub.dataset.sub; render(); return; }
  const reg = e.target.closest("[data-reg]");
  if(reg){ S.pilih = reg.dataset.reg; render(); return; }
  const ind = e.target.closest("[data-ind]");
  if(ind){ S.ind = ind.dataset.ind; renderEco(); document.querySelectorAll("[data-ind]").forEach(b => b.setAttribute("aria-current", b.dataset.ind === S.ind)); return; }
  const rt = e.target.closest("[data-rentang]");
  if(rt){ S.rentang = rt.dataset.rentang; renderEco(); return; }
  const all = e.target.closest("[data-all]");
  if(all){
    const keys = Object.keys(LEMBAGA).filter(k => k !== "dpr");
    if(S.lem.size === keys.length) S.lem = new Set(); else S.lem = new Set(keys);
    render(); return;
  }
  if(e.target.id === "themeBtn"){
    const cur = document.documentElement.getAttribute("data-theme");
    const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const nowDark = cur ? cur === "dark" : sysDark;
    document.documentElement.setAttribute("data-theme", nowDark ? "light" : "dark");
  }
});

document.addEventListener("change", e => {
  if(e.target.dataset.lem){
    e.target.checked ? S.lem.add(e.target.dataset.lem) : S.lem.delete(e.target.dataset.lem);
    renderBody(); syncCounts();
  }
  if(e.target.dataset.dmp){
    e.target.checked ? S.dampak.add(e.target.dataset.dmp) : S.dampak.delete(e.target.dataset.dmp);
    renderBody(); syncCounts();
  }
});

document.addEventListener("input", e => {
  if(e.target.id === "q"){
    S.q = e.target.value;
    renderBody();
    syncCounts();
  }
});

document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement.tagName !== "INPUT"){
    const q = document.getElementById("q");
    if(q){ e.preventDefault(); q.focus(); }
  }
});

renderTape();
render();
</script>
